    if (/^[[{]/.test(trimmed)) { try { JSON.parse(trimmed); return fail(`${label} is a JSON file`, 'VoiceBridge reads survey exports in CSV or Excel format.', 'Export the responses from your survey tool as CSV or Excel instead.'); } catch (e) { /* not JSON, carry on */ } }
    if (/^<(\?xml|!doctype|html)/i.test(trimmed)) return fail(`${label} is a web page or XML file`, 'VoiceBridge reads survey exports in CSV or Excel format.', 'Export the responses from your survey tool as CSV or Excel instead.');
    if (/^\{\\rtf/.test(trimmed)) return fail(`${label} is a Word-style text document`, 'VoiceBridge reads survey exports in CSV or Excel format.', 'Export the responses from your survey tool as CSV or Excel instead.');
    if ((text.match(/�/g) || []).length > Math.max(20, text.length * 0.02)) return fail(`${label} can’t be read as text`, 'Most of it is unreadable characters, so it is probably not a CSV file even if its name ends in .csv.', 'Export the responses from your survey tool as CSV or Excel.');
    const p = parseDelimited(text);
    if (p.unclosedQuoteLine) return fail(`${label} looks damaged`, `A quote mark on line ${p.unclosedQuoteLine} is never closed, so everything after it would be read as one long answer.`, `Open the file, find line ${p.unclosedQuoteLine}, and remove the stray " or add the closing one. Exporting the file again from your survey tool usually fixes it.`);
    // A stray quote mark can swallow the following rows into one long "answer". A real multi-line comment
    // doesn't contain a whole row's worth of column separators on one of its lines.
    const width = p.rows.length ? Math.max(...p.rows.slice(0, 5).map((r) => r.length)) : 0;
    const swallowed = (p.multiline || []).find((m) => m.maxDelims >= Math.max(3, (width - 1) * 0.5));
    if (swallowed) return fail(`${label} looks damaged`, `A quote mark on line ${swallowed.line} is not closed where it should be, so the rows after it run together into one answer.`, `Open the file, find line ${swallowed.line}, and remove the stray " or add the closing one. Exporting the file again from your survey tool usually fixes it.`);
    const t = shape(p.rows, p.lineOf, label);
    if (!t.ok) return t;
    if (dec.encoding === 'utf-16') t.notes.unshift('The file was saved as “Unicode text” (UTF-16); it was read correctly.');
    if (dec.encoding === 'windows-1252') t.notes.unshift('The file was saved in an older Windows text format; accented letters were read correctly.');
    if (p.delim !== ',' && p.delim !== ';' && p.delim !== '\t') t.notes.unshift('Columns are separated by “|” rather than commas; that was handled.');
    return { ok: true, format: 'csv', sheets: [{ name, headers: t.headers, rows: t.rows, notes: t.notes }] };
  }

  // ---------------------------------------------------------------- Preparing a survey
  // Finds the rating questions, puts every answer on the same 1–5 scale, and tidies group labels.
  // Returns { ok, headers, rows, notes, warnings } or { ok: false, error }.
  function prepareSurvey(sheet, label = 'This file') {
    const { headers } = sheet;
    let rows = sheet.rows.map((r) => ({ ...r }));
    const notes = [...(sheet.notes || [])];
    const warnings = [];
    const stats = headers.map((h) => {
      const vals = rows.map((r) => r[h]).filter((v) => v !== '' && v != null);
      const reads = vals.map(readAnswer);
      const nums = reads.filter((x) => x && x.n != null);
      const answered = reads.filter((x) => !(x && x.blank)); // everything that isn't an explicit non-answer, readable or not
      return {
        h, vals, reads,
        filled: vals.length,
        answered: answered.length,
        readable: nums.length + reads.filter((x) => x && x.blank).length,
        nums: nums.map((x) => x.n),
        words: nums.filter((x) => x.word).length,
        labelled: nums.filter((x) => x.labelled).length,
        decimals: reads.filter((x) => x && x.decimal != null).length,
        yesno: vals.filter((v) => YESNO.test(String(v).trim())).length,
      };
    });
    // A rating question: most answers readable, numbers (if any) within 0–10, and not a column that describes people.
    const COUNT_Q = /\b(how many|number of|how old)\b/i;
    const isCandidate = (s) => s.filled > 0 && !looksLikeField(s.h) && !COUNT_Q.test(s.h)
      && (s.readable + s.decimals) / s.filled >= 0.5 && s.nums.length + s.decimals > 0
      && s.nums.filter((n) => n >= 0 && n <= 10).length >= s.nums.length * 0.95;
    const cands = stats.filter(isCandidate);
    // A column tagged with a theme ("[Growth] ...") is certainly a rating question. If most of its answers can't be
    // read it would otherwise be dropped without a word, so it is refused instead.
    const lost = stats.find((s) => !cands.includes(s) && /\[[^\]]+\]/.test(s.h) && s.answered >= 5 && s.nums.length >= s.answered * 0.1 && s.nums.length + s.decimals < s.answered * 0.8);
    if (lost) {
      const examples = [...new Set(lost.vals.filter((v, i) => !(lost.reads[i] && (lost.reads[i].n != null || lost.reads[i].blank))))].slice(0, 4);
      return fail(`A question in ${label} has too many answers VoiceBridge can’t read`, `“${short(lost.h)}” has ${lost.answered - lost.nums.length} of ${lost.answered} answers that aren’t on a 1–5 agreement scale, for example ${examples.map((v) => `“${v}”`).join(', ')}.`, 'Correct those answers in the file, or delete the column if it isn’t a rating question, then upload it again.', 'unreadable');
    }

    // Averages instead of individual answers.
    const averaged = cands.filter((s) => s.decimals >= Math.max(3, s.filled * 0.2));
    if (averaged.length) {
      const s = averaged[0];
      return fail(`${label} seems to contain averages, not individual answers`, `The question “${short(s.h)}” has answers like ${s.vals.filter((v) => /\d[.,]\d/.test(v)).slice(0, 3).map((v) => `“${v}”`).join(', ')}. One person can’t answer 3.5 on a 1–5 scale, so these look like averages of several answers.`, 'Upload the raw export, with each person’s own answer to each question.', 'averages');
    }

    // Which scale? Only columns answered mainly with numbers count. 1–5 is used as is; 0–4 is shifted up by one;
    // a wider scale is refused, naming it. A few stray 0s or 6s in a 1–5 survey are typos, not a different scale.
    const numeric = cands.filter((s) => s.nums.length && s.words < s.nums.length / 2);
    const allNums = numeric.flatMap((s) => s.nums).filter((n) => n >= 0 && n <= 10);
    const share = (f) => (allNums.length ? allNums.filter(f).length / allNums.length : 0);
    if (allNums.length && share((n) => n > 5) >= 0.05) {
      const top = Math.max(...allNums) <= 7 ? 7 : 10;
      const low = share((n) => n === 0) > 0 ? 0 : 1;
      return fail(`${label} uses a ${low}–${top} scale`, `VoiceBridge’s rules (what counts as “positive”, the silence test) are set for a five-point agreement scale, and converting a ${top}-point scale would change what the answers mean.`, 'Upload a survey that used a five-point scale (Strongly disagree to Strongly agree, or 1–5). The start page describes the format.', 'scale');
    }
    // 0–4: any 0 and no 5 at all. A 1–5 scale has no 0 and a 0–4 scale has no 5, so this holds however few people
    // chose the lowest answer. (A minimum share of 0s used to be required here; a 0–4 survey where hardly anyone
    // strongly disagreed slipped under it and was read one point too low.) Stray 0s in a 1–5 survey come with 5s.
    const shift = share((n) => n === 0) > 0 && share((n) => n === 5) === 0;
    if (shift) notes.push('Answers were coded 0–4. They were read as 1–5 (0 = Strongly disagree … 4 = Strongly agree).');

    // Convert every candidate column, counting answers that can't be read.
    const ratingCols = [];
    const unreadable = [];
    for (const s of cands) {
      const bad = s.reads.filter((x) => x === null || (x && x.decimal != null) || (x && x.n != null && (shift ? x.n > 4 : x.n < 1 || x.n > 5)));
      if (s.answered && bad.length > s.answered * 0.2) {
        if ((s.answered - bad.length) / s.answered < 0.5) continue; // mostly not answers: not a rating question
        const examples = [...new Set(s.vals.filter((v, i) => bad.includes(s.reads[i])))].slice(0, 4);
        return fail(`A question in ${label} has too many answers VoiceBridge can’t read`, `“${s.h}” has ${bad.length} of ${s.answered} answers that aren’t on a 1–5 agreement scale, for example ${examples.map((v) => `“${v}”`).join(', ')}.`, 'Correct those answers in the file, or delete the column if it isn’t a rating question, then upload it again.', 'unreadable');
      }
      ratingCols.push(s.h);
      let badHere = 0; const examples = new Set();
      rows.forEach((r) => {
        const a = readAnswer(r[s.h]);
        if (!a || (a.n == null && !a.blank)) { if (String(r[s.h]).trim()) { badHere++; examples.add(r[s.h]); } r[s.h] = ''; return; }
        if (a.blank) { r[s.h] = ''; return; }
        const n = shift ? a.n + 1 : a.n;
        if (n < 1 || n > 5) { badHere++; examples.add(r[s.h]); r[s.h] = ''; return; }
        r[s.h] = String(n);
      });
      if (badHere) unreadable.push({ h: s.h, n: badHere, examples: [...examples].slice(0, 3) });
    }
    if (unreadable.length) {
      const total = unreadable.reduce((a, u) => a + u.n, 0);
      notes.push(`${total} answer${total === 1 ? '' : 's'} couldn’t be read as a point on the scale and ${total === 1 ? 'was' : 'were'} treated as unanswered: ${unreadable.slice(0, 4).map((u) => `${u.examples.map((e) => `“${e}”`).join(', ')} in “${short(u.h)}”`).join('; ')}${unreadable.length > 4 ? '; …' : ''}.`);
    }
    const labelled = cands.filter((s) => s.labelled > 0 && ratingCols.includes(s.h));
    if (labelled.length) notes.push('Answers written with their number (such as “5 - Strongly agree”) were read by their number.');

    if (!ratingCols.length) {
      const yesno = stats.filter((s) => s.filled && s.yesno >= s.filled * 0.9 && looksLikeQuestion(s.h));
      if (yesno.length) return fail(`${label} has yes/no questions, not an agreement scale`, `Questions such as “${short(yesno[0].h)}” were answered yes or no. VoiceBridge’s findings rest on a five-point agreement scale (Strongly disagree to Strongly agree).`, 'Use a survey whose rating questions have five answer options. The start page has a template.', 'yesno');
      return fail(`No rating questions were found in ${label}`, `VoiceBridge looked at all ${headers.length} columns and none of them holds answers on a five-point agreement scale (Strongly disagree to Strongly agree, or 1–5).`, 'Check this is the survey responses file (not the headcount or a summary), then use the templates on the start page as a guide to the layout.', 'norating');
    }

    // Questions with no answers at all are left out, and listed.
    const empty = stats.filter((s) => s.filled === 0 && looksLikeQuestion(s.h));
    if (empty.length) notes.push(`${empty.length} question${empty.length === 1 ? ' has' : 's have'} no answers at all and ${empty.length === 1 ? 'was' : 'were'} left out: ${empty.slice(0, 4).map((s) => `“${short(s.h)}”`).join(', ')}${empty.length > 4 ? ' …' : ''}.`);

    // Group labels: spelling variants that differ only in capitals or spaces are the same group.
    const merged = tidyLabels(rows, headers.filter((h) => !ratingCols.includes(h)), notes, warnings);
    rows = merged;
    return { ok: true, headers, rows, notes, warnings, ratingCols };
  }

  function short(h) { const s = String(h).replace(/^\s*[A-Z]{1,3}\d{1,3}\s*/, '').replace(/^\[[^\]]+\]\s*/, ''); return s.length > 60 ? s.slice(0, 57) + '…' : s; }

  function tidyLabels(rows, cols, notes, warnings) {
    for (const h of cols) {
      const vals = rows.map((r) => r[h]).filter((v) => v !== '' && v != null);
      const distinct = [...new Set(vals)];
      if (distinct.length < 2 || distinct.length > 30 || distinct.some((v) => v.length > 45) || distinct.length > vals.length * 0.5) continue;
      const key = (v) => v.trim().replace(/\s+/g, ' ').toLowerCase();
      const groups = new Map();
      vals.forEach((v) => { const k = key(v); if (!groups.has(k)) groups.set(k, new Map()); const g = groups.get(k); g.set(v, (g.get(v) || 0) + 1); });
      const changes = [];
      const pick = new Map();
      groups.forEach((variants, k) => {
        const best = [...variants.entries()].sort((a, b) => b[1] - a[1])[0][0].trim().replace(/\s+/g, ' ');
        pick.set(k, best);
        const others = [...variants.keys()].filter((v) => v !== best);
        if (others.length) changes.push(`${others.map((v) => `“${v}”`).join(', ')} → “${best}”`);
      });
      if (changes.length) {
        rows.forEach((r) => { if (r[h]) r[h] = pick.get(key(r[h])) || r[h]; });
        notes.push(`In “${h}”, labels that differ only in capitals or spaces were treated as the same group: ${changes.slice(0, 4).join('; ')}${changes.length > 4 ? ' …' : ''}.`);
      }
      // Likely the same group written two ways, such as "F" and "Female". Not merged: the user decides.
      // A column mixing one-letter codes ("F") with full words ("Woman", "Female") probably names the same group twice.
      const finals = [...new Set(pick.values())];
      const codes = finals.filter((v) => /^[a-z]$/i.test(v)), words = finals.filter((v) => v.length > 2 && !PREFER.test(v));
      if (codes.length && words.length) {
        const like = codes.map((c) => [c, words.find((w) => w[0].toLowerCase() === c.toLowerCase())]).find(([, w]) => w);
        warnings.push(`“${h}” mixes short codes (${codes.slice(0, 3).map((c) => `“${c}”`).join(', ')}) with full labels (${words.slice(0, 3).map((w) => `“${w}”`).join(', ')}).${like ? ` For example, “${like[0]}” may mean “${like[1]}”.` : ''} If a code means the same group as a label, make them match in your file and upload it again; until then they are counted as different groups.`);
      }
    }
    return rows;
  }

  // ---------------------------------------------------------------- Preparing a headcount
  function prepareHeadcount(sheet, label = 'The headcount file') {
    const notes = [...(sheet.notes || [])];
    const rows = sheet.rows.map((r) => ({ ...r })).filter((r) => {
      const vals = Object.values(r).filter((v) => v !== '');
      return vals.length && !/^(total|totals|grand total|sum|count)$/i.test(vals[0]);
    });
    if (!rows.length) return fail(`${label} has no people in it`, 'It has column names but no rows of people.', 'Export the headcount again with one row for every person who was invited.');
    // A headcount lists people; if it has rating answers in it, it is a survey file.
    const ratingLike = sheet.headers.filter((h) => {
      if (looksLikeField(h)) return false;
      const vals = rows.map((r) => r[h]).filter(Boolean);
      return vals.length >= 5 && vals.filter((v) => { const a = readAnswer(v); return a && a.n >= 1 && a.n <= 5 && (a.word || looksLikeQuestion(h)); }).length >= vals.length * 0.8;
    });
    if (ratingLike.length >= 2) return fail(`${label} looks like a survey file, not a headcount`, `It has answers to questions such as “${short(ratingLike[0])}”. A headcount lists everyone who was invited, with their department, gender and so on, and no answers.`, 'Upload the survey export in the survey box, and a headcount (or nothing) in the headcount box.');
    const warnings = [];
    tidyLabels(rows, sheet.headers, notes, warnings);
    return { ok: true, headers: sheet.headers, rows, notes, warnings };
  }

  // Is this sheet a survey (has rating questions) or something else?
  // A file that fails only because of its scale or answers is still a survey (the user gets the survey's message).
  function isSurvey(sheet) { const p = prepareSurvey(sheet); return p.ok || p.error.code !== 'norating'; }

  const api = { read, prepareSurvey, prepareHeadcount, isSurvey, readAnswer, parseDelimited };
  root.VB_INTAKE = api;
  if (typeof module !== 'undefined') module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* VoiceBridge guidance library.
 *
 * Process-level next steps and contextual questions. Written by hand from
 * I-O practice and the evidence brief; the app selects and fills them in,
 * it never invents new advice. Deliberately not action plans: each step says
 * how to find out more and who should lead, not what the answer is.
 */
(function (root) {
  const pct = (p) => (p == null ? '–' : Math.round(p * 100) + '%');

  const STEPS = {
    fair: {
      group: (s) => [
        `Pull the last two years of promotion and acting-appointment decisions for ${s.place || 'the organisation'}. Compare who applied, who was shortlisted and who was appointed, by gender and race.`,
        `Hold two listening sessions with ${s.who}, led by someone outside their reporting line. Ask what gets in the way of applying and being chosen. Ask about the process, not about people.`,
        'Share what you found, change how roles are advertised and decided if the data supports it, and ask the two promotion questions again in a three-month pulse.',
      ],
      org: () => [
        'Write down how promotion and pay decisions are actually made today, step by step, and check it against what employees are told.',
        'Publish the criteria for the next five appointments before they are made.',
        'Re-ask the fairness questions in a three-month pulse.',
      ],
      lead: 'People & Culture, with the responsible executive',
      avoid: 'Don’t launch a mentoring programme before you know whether the barrier is the process itself.',
    },
    growth: {
      group: (s) => [
        `Check who received development conversations, training spend and learnerships in the past year, by level and race.`,
        `Make sure everyone in this group (${s.who}) has a development conversation in the next 60 days, with a written next step.`,
        'Ask them what format works: shift-friendly times, on-site delivery, and the language the training is run in.',
      ],
      org: () => [
        'Set a simple standard: every person has one development conversation every six months, recorded.',
        'Report completion by department and level each quarter.',
        'Re-ask the growth questions in a three-month pulse.',
      ],
      lead: 'People & Culture, with line managers',
      avoid: 'Don’t treat this as a motivation problem before checking who actually gets access.',
    },
    trust: {
      group: () => [
        'Find out what happened after the last survey for this group: were results shared, and did anything change?',
        'Share these results with them directly, including the uncomfortable parts.',
        'Name an owner and a date for each focus area and show them where to track it.',
      ],
      org: () => [
        'Release these results to everyone within two weeks, including the uncomfortable findings.',
        'Name an owner and a date for each focus area, and publish both.',
        'Report back at 90 days on what changed and what didn’t.',
      ],
      lead: 'Executive committee',
      avoid: 'Don’t run another survey before people have seen action on this one.',
    },
    voice: {
      group: (s) => [
        `Arrange skip-level conversations: a senior leader meets ${s.who} without their direct manager in the room.`,
        'Offer a way to raise concerns that doesn’t go through the line manager, and say who reads it.',
        'When someone speaks up, close the loop visibly: say what happened with what they raised.',
      ],
      org: () => [
        'Ask senior leaders to hold open skip-level sessions each quarter.',
        'Set up a confidential channel for concerns with a named, independent owner.',
        'Track and publish how many concerns were raised and resolved.',
      ],
      lead: 'People & Culture, with the senior leader above the team',
      avoid: 'Don’t ask the team who said what, and don’t hold a "tell us what’s wrong" meeting with their manager present.',
    },
    mgr: {
      group: (s) => [
        'Check whether this is one leader or a wider pattern by looking across teams in the same area.',
        `Have People & Culture hold confidential conversations with ${s.who}, offered to the whole team so nobody is singled out.`,
        'Agree specific behaviour goals with the managers involved and check them in the next pulse.',
      ],
      org: () => [
        'Look at how managers are selected and what they are measured on.',
        'Give managers their own team results with a coach to read them.',
        'Re-ask the manager questions in a three-month pulse.',
      ],
      lead: 'People & Culture',
      avoid: 'Don’t share team-level comments with the manager the comments are about.',
    },
    belong: {
      group: (s) => [
        `Hold listening sessions with ${s.who}, run by someone they trust, to understand what makes them feel like outsiders.`,
        'Look at everyday norms: meeting language, who gets invited, which events happen when.',
        'Agree one or two visible changes and check back in three months.',
      ],
      org: () => [
        'Run listening sessions across departments to understand what belonging looks like here.',
        'Review everyday norms: meeting language, social events, recognition.',
        'Re-ask the belonging questions in a three-month pulse.',
      ],
      lead: 'People & Culture',
      avoid: 'Don’t answer this with a one-off event.',
    },
    _default: {
      group: (s) => [
        `Talk with ${s.who} to understand what sits behind this result.`,
        'Check whether processes or access differ for this group.',
        'Agree a visible next step and re-measure in three months.',
      ],
      org: () => ['Share the result openly.', 'Ask people what would make the biggest difference.', 'Re-measure in three months.'],
      lead: 'People & Culture',
      avoid: 'Don’t jump to a solution before you understand the cause.',
    },
  };

  const CONFIDENTIAL_STEPS = [
    'Offer confidential one-to-one conversations to everyone in the team, led by People & Culture, so nobody is singled out.',
    'Review any grievances, exits or transfer requests from this team in the past year.',
    'Decide next steps based on what you learn. Involve the team leader only once you understand the pattern.',
  ];

  function stepsFor(f, ctx) {
    const lib = STEPS[f.dim.key] || STEPS._default;
    const s = { who: f.kind === 'org' ? 'employees' : f.label.charAt(0).toLowerCase() + f.label.slice(1), place: ctx.place };
    s.who = s.who.replace(/\b(african|coloured|indian|white)\b/gi, (m) => m.charAt(0).toUpperCase() + m.slice(1).toLowerCase());
    return { steps: (f.kind === 'org' ? lib.org : lib.group)(s), lead: lib.lead, avoid: lib.avoid };
  }

  // Context: facts from the organisation's own data first, then questions worth checking.
  function contextFor(f, a, ds) {
    const out = [];
    const g = f.filter[ds.sem.gender], r = f.filter[ds.sem.race], l = f.filter[ds.sem.level], t = f.filter[ds.sem.tenure];
    const scopeKey = f.filter[ds.sem.division] ? ds.sem.division : f.filter[ds.sem.department] ? ds.sem.department : null;
    const scope = scopeKey ? { [scopeKey]: f.filter[scopeKey] } : null;
    const placeName = scope ? f.filter[scopeKey] : 'Kumo';

    if (g && /woman|female/i.test(g)) {
      const rep = a.representation(ds.sem.gender, g, scope);
      // Only state it when the headcount actually contains women; "but" only when managers really are fewer (round 4).
      if (rep && rep.mgmtShare != null && rep.overall > 0) {
        const where = placeName === 'Kumo' ? 'the workforce' : placeName;
        const text = rep.mgmtShare < rep.overall - 0.05 ? `Women are ${pct(rep.overall)} of ${where}, but only ${pct(rep.mgmtShare)} of its managers.` : `Women are ${pct(rep.overall)} of ${where} and ${pct(rep.mgmtShare)} of its managers.`;
        out.push({ kind: 'data', text, rep, attr: 'Women' });
      }
    }
    if (r && /african|coloured|indian|black/i.test(r)) {
      const rep = a.representation(ds.sem.race, r, scope);
      // Skipped when nobody in the headcount has this label (e.g. "African" vs "Black African"): a box of 0% would be wrong, not informative.
      // Compares the most and least senior levels with enough people to show, and says "but only" only when there is a real gap.
      const shown = rep ? rep.rows.filter((x) => !x.hidden) : [];
      if (rep && rep.overall > 0 && shown.length >= 2) {
        const top = shown[0], low = shown[shown.length - 1];
        const T = `${top.level.toLowerCase()} roles`, L = `${low.level.toLowerCase()} roles`;
        const text = top.share < low.share - 0.05 ? `${r} employees make up ${pct(low.share)} of ${L}, but only ${pct(top.share)} of ${T}.`
          : top.share > low.share + 0.05 ? `${r} employees make up ${pct(top.share)} of ${T} and ${pct(low.share)} of ${L}.`
          : `${r} employees make up a similar share of ${T} (${pct(top.share)}) and ${L} (${pct(low.share)}).`;
        out.push({ kind: 'data', text, rep, attr: `${r} employees` });
      }
    }
    const H = [];
    if (f.dim.key === 'fair' && g && /woman|female/i.test(g)) {
      H.push({ q: 'Informal routes to promotion, such as acting roles and being tapped on the shoulder, can bypass women.', check: 'Who held acting supervisor roles in the past year?' });
      H.push({ q: 'Shift and overtime patterns, and unsafe transport after late shifts, can turn "availability" into a hidden promotion criterion.', check: 'Is overtime or night-shift availability used when choosing team leaders?' });
    }
    if (f.dim.key === 'fair' && r && !g) H.push({ q: 'Selection criteria such as "presence" or "fit" can favour people who look like current leaders.', check: 'Are the criteria for the last five appointments written down?' });
    if (f.dim.key === 'growth' && (r || l)) {
      H.push({ q: 'Development offered at head office or during office hours is hard to reach from a shift-based floor.', check: 'Where and when did last year’s training happen, and who attended?' });
      H.push({ q: 'First-generation professionals often have less access to unwritten career knowledge.', check: 'Are promotion and development expectations written down and explained?' });
      H.push({ q: 'Training run only in English can exclude capable people.', check: 'Which languages are development programmes offered in?' });
    }
    if (f.dim.key === 'trust') {
      const tenureCol = ds.sem.tenure;
      if (tenureCol) {
        const long = a.cell({ [tenureCol]: '5+ years' }, 'trust'), first = a.cell({ [tenureCol]: 'Under 1 year' }, 'trust');
        if (long.n >= a.settings.minGroup && first.n >= a.settings.minGroup) out.push({ kind: 'data', text: `${pct(first.p)} of people in their first year trust that action will follow, but only ${pct(long.p)} of those with 5+ years’ service do. People who have seen previous surveys trust them least.` });
      }
      H.push({ q: 'If last year’s results were not shared, this result is the expected outcome, not a mood.', check: 'Did last year’s results reach every employee? What changed because of them?' });
      H.push({ q: 'People who stop answering surveys tend to believe nothing is done with the data (Rogelberg et al., 2000).', check: 'Is response rate falling year on year?' });
    }
    if (f.dim.key === 'voice') H.push({ q: 'Silence is usually a judgement that speaking up is risky or pointless, not a lack of opinions (Milliken et al., 2003).', check: 'What happened the last time someone in this group raised a concern?' });
    if (f.dim.key === 'mgr') H.push({ q: 'A team-level pattern may reflect one leader, or a practice the whole area tolerates.', check: 'Do other teams under the same senior leader show the same pattern?' });
    if (f.dim.key === 'belong') H.push({ q: 'Everyday norms (meeting language, social events) decide who feels like an insider.', check: 'Which language are meetings held in? Who organises social events?' });
    if (!H.length) H.push({ q: 'Look for system explanations before individual ones.', check: 'Do processes, access or workload differ for this group?' });
    return { facts: out, questions: H };
  }

  function limitsFor(f) {
    const L = ['Why it is happening. The survey shows what people experience, not the cause.'];
    if (f.silence && f.silence.nonresp > 0) L.push(`How the ${f.silence.nonresp} people who didn’t respond feel. Counting them, the true share with this concern is between ${pct(f.silence.floor)} and ${pct(f.silence.ceiling)}.`);
    if (f.kind !== 'org') L.push('Whether every person in this group shares it. These are group patterns, never a verdict on any one person.');
    return L;
  }

  function ownerFor(f, ds, leaders) {
    const dep = f.filter[ds.sem.department], div = f.filter[ds.sem.division];
    if (f.kind === 'org') return { owner: 'Executive committee', sees: 'Everyone sees this finding and its response.' };
    if (dep || div) {
      const who = (leaders && (leaders[dep] || leaders[div])) || `Head of ${dep || div}`;
      return { owner: who, sees: 'The executive committee and all employees see it at the same time.' };
    }
    return { owner: 'Executive committee, with People & Culture', sees: 'Everyone sees this finding and its response.' };
  }

  // How a finding reads on the employee page. Plain, no numbers about small groups.
  function employeeLine(f) {
    const map = {
      fair: 'don’t see a fair path to promotion',
      growth: 'aren’t getting the development conversations they need',
      trust: 'don’t believe this survey will lead to change',
      voice: 'don’t feel safe speaking up',
      mgr: 'don’t feel treated fairly by their manager',
      belong: 'don’t always feel respected or able to be themselves',
    };
    const who = f.kind === 'org' ? 'Many of you' : f.label;
    return `${who} ${map[f.dim.key] || f.ct.plural}.`;
  }

  root.VB_GUIDE = { stepsFor, contextFor, limitsFor, ownerFor, employeeLine, CONFIDENTIAL_STEPS };
  if (typeof module !== 'undefined') module.exports = root.VB_GUIDE;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* VoiceBridge app: screens, state and interactions. */
(function () {
  const D = window.VB_DATA, E = window.VB_ENGINE, G = window.VB_GUIDE, IN = window.VB_INTAKE;
  const pct = E.pct;
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const quoteHTML = (t) => esc(t).replace(/\[(name|number removed|email removed|ID number removed)\]/g, (m, x) => `<span class="redacted">${x === 'name' ? 'name removed' : x}</span>`);
  const today = new Date();

  const fmtShort = (d) => new Date(d).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' });

    laptop: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>',
    users: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.2A5 5 0 0 1 21.5 19"/></svg>',
    building: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"/></svg>',
    exec: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10l7-5 7 5v11"/><path d="M10 21v-6h4v6"/></svg>',
    phone: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18h2"/></svg>',
    chev: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    arrow: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    up: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 20h16"/></svg>',
    info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',

  // Saved release state belongs to one exact pair of files: a different survey never picks up another's release.
  function dataKey() {
    const r = S.files.responses, h = S.files.headcount;
    if (!r) return 'none';
    if (!r.key) r.key = fingerprint(JSON.stringify([r.headers, r.rows.map((x) => r.headers.map((k) => x[k]))]));
    const hk = h ? (h.key || (h.key = fingerprint(JSON.stringify([h.headers, h.rows.length, h.rows.slice(0, 50)])))) : '-';
    return r.key + '/' + hk;

    catch (e) { S.storageFailed = true; }
  }
  function save() { try { localStorage.setItem(storeKey(), JSON.stringify(S.store)); S.storageFailed = false; } catch (e) { S.storageFailed = true; } }

  function fingerprint(str) {
    let h1 = 0x811c9dc5, h2 = 0x1234567;
    for (let i = 0; i < str.length; i++) { h1 ^= str.charCodeAt(i); h1 = Math.imul(h1, 16777619); h2 = Math.imul(h2 ^ str.charCodeAt(i), 2246822507); }
    const hex = ((h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0')).toUpperCase();
    return hex.slice(0, 4) + ' · ' + hex.slice(4, 8) + ' · ' + hex.slice(8, 12);
  }

  const DATA_SCREENS = ['check', 'reading', 'results', 'release', 'follow', 'employees'];
  function go(screen, opts = {}) {
    if (DATA_SCREENS.includes(screen) && !S.cols) screen = 'start';
    if (['results', 'release', 'follow', 'employees'].includes(screen) && !S.a) screen = S.cols ? 'check' : 'start';
    S.screen = screen;

    render();

  // Safety net: if anything unexpected goes wrong, the page says so plainly instead of freezing or going blank.

  function showProblem(e) {
    try { console.error('VoiceBridge:', e); } catch (x) { /* no console */ }
    const app = $('#app');
    app.innerHTML = `<div class="wrap"><section class="check"><div class="hc-warn" role="alert">
      <h3>${I.wait} Something went wrong on this screen</h3>

    </div></section></div>`;
  }
